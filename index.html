<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/img/7_statusbars/3_icons/icon_salsa_bottle.png" type="image/x-icon">
    <script src="./scripts/main.js"></script>
    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/moveable-object.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/coinbar.class.js"></script>
    <script src="./classes/bottlebar.class.js"></script>
    <script src="./classes/bossbar.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/big-chicken.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/enboss.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./scripts/game.js"></script>
</head>
<body onload="init()">
    <div class="game-container">
        <h1>El Pollo Loco</h1>
        <canvas id="canvas_id" class="visible" width="720" height="480"></canvas>
        <div id="game_over" class="game-size-container invisible">
            <div class="game-over-container">
                <img class="game-over-image" src="./assets/img/You won, you lost/Game Over.png" alt="game over image with pepe">
                <div class="btn-design" onclick="init()">
                    <span class="text-design">Play again</span>
                </div>
                <div class="btn-design">
                    <span class="text-design">Main menu</span>
                </div>
            </div>
        </div>
        <div id="win_game" class="game-size-container invisible">
            <div class="game-over-container">
                <img class="win-image" src="./assets/img/You won, you lost/You win B.png" alt="win image">
                <div class="btn-design" onclick="init()">
                    <span class="text-design">Play again</span>
                </div>
                <div class="btn-design">
                    <span class="text-design">Main menu</span>
                </div>
            </div>
        </div>
        <div id="sound_btn" class="sound-btn">
            <img id="sound_image" class="sound-image" src="./assets/icons/sound.svg" alt="mute button as speaker">
        </div>
    </div>
</body>
</html>
